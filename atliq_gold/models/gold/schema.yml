version: 2

models:
  - name: fact_sales
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_customer'), field: customer_id}}
      - name: product_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_product'), field: product_id}}
      - name: order_date
        data_tests:
          - relationships: {arguments: {to: ref('dim_date'), field: date_day}}
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: ['Placed', 'Shipped', 'Delivered', 'Cancelled', 'Returned']}
  - name: fact_web_sessions
    columns:
      - name: session_id
        data_tests: [unique, not_null]